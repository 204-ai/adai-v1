<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A(DAI) — a digital arts institute</title>
  <!-- Vendor libs are self-hosted under /field-static/vendor and deferred so
       they no longer block HTML parsing — the "loading field" indicator paints
       immediately and these download in parallel. p5 is the minified build
       (260 KB br vs 780 KB). defer preserves document order, so p5 et al. are
       ready before the deferred field scripts below run. -->
  <script defer src="/field-static/vendor/simplex-noise.min.js?v=20260530a"></script>
  <script defer src="/field-static/vendor/p5.min.js?v=20260530a"></script>
  <script defer src="/field-static/vendor/p5.svg.js?v=20260530a"></script>
  <script defer src="/field-static/vendor/perlin.js?v=20260530a"></script>
  <script defer src="/field-static/vendor/d3-path.min.js?v=20260530a"></script>
  <!-- Self-hosted Google Fonts (latin + latin-ext, font-display:swap) — no
       third-party round-trip to fonts.googleapis.com / fonts.gstatic.com. -->
  <link rel="stylesheet" href="/field-static/css/fonts.css?v=20260530a">
  <link rel="stylesheet" href="/field-static/style.css?v=20260708a">
  <link rel="stylesheet" href="/field-static/style-archivist.css?v=20260610a">
  <link rel="stylesheet" href="/field-static/css/entity-view.css?v=20261024n">
  <link rel="stylesheet" href="/field-static/css/activity.css?v=20261023a">
</head>
<body>
  <div id="mopey"></div>

  <div id="field-loading" data-state="loading" aria-live="polite" aria-label="loading field">
    <span class="field-loading__pip" aria-hidden="true"></span>
    <span class="field-loading__text">loading field<span class="field-loading__dots" aria-hidden="true"></span></span>
  </div>

  <div id="chrome">
    <div id="logotype" aria-label="adai">
      <span id="logotype-text"></span><span class="logotype__cursor" aria-hidden="true"></span>
    </div>
    <div id="coordinates">
      <span id="coord-x">x 0.000</span>
      <span id="coord-y">y 0.000</span>
    </div>

    <div id="vitals">
      <div class="vital-row"><span class="vital-label">nodes</span><span class="vital-value" id="v-nodes">—</span></div>
      <div class="vital-row"><span class="vital-label">edges</span><span class="vital-value" id="v-edges">—</span></div>
      <div class="vital-row"><span class="vital-label">signal</span><span class="vital-value" id="v-signal">0.00</span></div>
      <div class="vital-row"><span class="vital-label">mode</span><span class="vital-value" id="v-mode">orbit [m]</span></div>
    </div>

    <nav id="rooms">
      <a href="#sense" class="room-link active">sense</a>
      <a href="/contribute" class="room-link">contribute</a>
      <a href="#philosophy" class="room-link">philosophy</a>
      <a href="/field-static/brand.html" class="room-link">brand</a>
      <a href="/offline" class="room-link">offline</a>
      <a href="https://github.com/a-digital-arts-institute/adai-v1" class="room-link" target="_blank" rel="noopener">github</a>
    </nav>


  </div>

  <!-- All deferred: they execute in document order after the vendor libs above
       (which they depend on for p5/d3), once the DOM is parsed. graph-loader is
       self-contained and kicks off the streaming graph fetch as soon as it runs. -->
  <script defer src="/field-static/adai-system.js?v=20260513a"></script>
  <script defer src="/field-static/brand-state.js?v=20260513a"></script>
  <script defer src="/field-static/js-interface/graph-loader.js?v=20260611a"></script>
  <script defer src="/field-static/js-interface/edge-type-colors.js?v=20261024r"></script>
  <script defer src="/field-static/sketch-brand.js?v=20260609a"></script>
  <script defer src="/field-static/js-interface/embed.js?v=20261028a"></script>
  <script defer src="/field-static/js-interface/field-address.js?v=20261023b"></script>
  <script defer src="/field-static/js-interface/graph-field.js?v=20261024n"></script>
  <script defer src="/field-static/js-interface/entity-view.js?v=20261024n"></script>
  <script defer src="/field-static/js-interface/chat-narrator.js?v=20261013a"></script>
  <script defer src="/field-static/js-interface/search-palette.js?v=20260513a"></script>
  <script defer src="/field-static/js-interface/archivist-chat.js?v=20261013a"></script>
  <script defer src="/field-static/js-interface/activity.js?v=20261023c"></script>
  <script defer src="/field-static/field.js?v=20261008a"></script>
</body>
</html>
